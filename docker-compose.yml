services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - UPVOTE_SECRET_KEY=${UPVOTE_SECRET_KEY:?请在 .env 中设置随机密钥（见 .env.example）}
      - UPVOTE_DATABASE_URL=sqlite:////app/data/upvote.db
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: